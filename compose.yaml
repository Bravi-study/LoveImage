x-app: &app
  build: .
  image: loveimage
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://loveimage:${DB_PASSWORD:-loveimage}@db/loveimage
  volumes:
    - data:/app/data
  depends_on:
    db:
      condition: service_healthy
  # The worker waits up to 30 s for running jobs after SIGTERM.
  stop_grace_period: 40s

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "loveimage.worker"]

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: loveimage
      # Postgres applies this only when the volume is first created.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loveimage}
      POSTGRES_DB: loveimage
    volumes:
      - pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loveimage -d loveimage"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # A real domain gets a public certificate; localhost gets a local one.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  pg:
  caddy_data:
  caddy_config:
